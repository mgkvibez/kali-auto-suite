[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaliauto"
version = "0.1.0"
description = "Authorized, non-destructive recon orchestration: scope-gated, dry-run by default, every action audited."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "mgkvibez"}]
keywords = ["security", "recon", "pentest", "authorized", "audit"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
kaliauto = "kaliauto.cli:main"

[tool.setuptools.packages.find]
include = ["kaliauto*"]
